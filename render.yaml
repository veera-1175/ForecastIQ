services:
  - type: web
    name: forecastiq
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FORECASTIQ_DEMO_MODE
        value: "true"
      - key: FORCE_PANDAS_ETL
        value: "1"
      - key: LLM_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
